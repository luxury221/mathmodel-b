do_not_repeat:
  - Do not label v44 UNKNOWN as infeasible, or keep restarting the identical time-capped model; change the feasibility formulation or add structural guidance first.
  - Do not apply v43 absence or inspection bounds to 16-source missions, and do not confuse the 10-source 326.74 bound with impossibility of the overall 300-second mean goal.
  - Do not add mandatory receiver-switch costs to optical operations; v43 explicitly corrects that initial assumption before its main calculation.
  - Do not interpret v43 fractional radial masses or dual bounds as an executable patrol network or achieved official time.
  - Do not promote v42 from its 13-source gain; the locked 18-case expansion regressed, and source counts or scenario labels cannot be used for strategy selection.
  - Do not retune v42 phase steps or next-action waypoint proxies on the expanded development cases; pursue a distinct coverage-obligation mechanism instead.
  - Do not promote v41 next-action ordering or single-probe interleaving; both registered Q3 candidates increased complete-mission movement and mean time.
  - Do not interpret v40 two-edge fixed-order saving bounds as adaptive mission savings or universal algorithm bounds; no new policy was run in v40.
  - Do not promote v39 station_bind from its two true replacements; both complete missions regressed despite positive local route proxies.
  - Do not simply increase v39 cut rounds or loosen geometry margins; the two safe interpolated points have geometry evidence only and do not establish performance gains.
  - Do not repeat v38 pairing of the same natural action stops or loosen its coverage gate; zero valid commitments and the only lower-cost candidate has a real undetectable-source witness.
  - Do not count v35 optical repair as free; all tested mixed layouts with extra optical stops missed the geometry-cost gate.
  - Do not repeat v36 origin-center-based phase selection; both actually rotated development cases became slower.
  - Do not promote v37 smaller networks with nonempty remnants; the best one has an explicit legal-physics undetectable-source counterexample.
  - Do not repeat v34 maturity/admission threshold tuning; active measurements fell but movement and complete-task time increased for both preregistered modes.
  - Do not equate shorter current waypoint tours with lower complete mission time.
  - Do not repeat soft-prior or radial-radius tweaks without a new testable mechanism.
  - Do not count hypothetical future observations or ignore nonempty coverage remnants.
  - Do not use official FORMAL tests or change frozen Python dependencies; official PRACTICE requires a validated isolated adapter and visible mode checks.
  - Do not describe frozen Q3 target_radius as 130; runtime is 2000 and older descriptions are corrected separately.
  - Do not promote v30 route-proxy savings or v31 additional positive measurements as actual complete-mission gains.
  - Do not promote v32 probabilistic long probes; both registered variants regressed despite bounded fallback.
  - Do not promote v16 transit from its six-case gain; its full 18-case development comparison regressed.
  - Do not treat predicted bundle exits or fixed patrol commitments as validated global travel savings.
  - Q3 reception radius is fixed but unknown in [1000,1500]; never clip positive observations to 1000 meters.
  - Do not count source-domain boundary recutting or GEOS roundoff as useful range-coupling information.
  - Keeping a larger belief for roundoff safety never permits ignoring nonempty discovery-coverage remnants.
  - Do not promote area-per-second frontier scans or source-first pursuit; both regressed in complete-task comparisons.
  - Do not interpret the conditional 21-station full-absent-scan bound as a universal algorithm lower bound or a proof that 300 is impossible.
  - Do not promote v28 sentinel from its 0.240438 second development gain; it failed the preregistered expansion gate.
  - Do not equate passing finite topology witnesses with continuous discovery coverage; the 20-point candidates retained real holes.
  - Failed optical sentinels or absent near responses do not prove that no sources exist near the origin.
  - The v27 preserving-outer-coordinate networks all failed radio-only coverage and had no performance runs.
